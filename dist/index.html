<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CRAFT LAB 로고의 행 구성과 개별 글자 움직임을 실험하는 모션 플레이그라운드">
  <title>CRAFT LAB · Motion Playground</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23231815'/%3E%3Cpath d='M7 7h18v18H7z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 11h8v10h-8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root { --ink:#231815; --paper:#f7f7f4; --line:rgba(35,24,21,.25); --accent:#ff5c35; --cell:clamp(52px,7vw,86px); --step:calc(var(--cell)*.9309); }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:24px 28px 20px}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:15px}
    .brand{font-size:14px;font-weight:700;letter-spacing:-.02em}
    .status{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(255,92,53,.12)}
    main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:28px 0 18px;min-height:0}
    .stage{position:relative;overflow:hidden;min-height:620px;border:1px solid var(--ink);background:#fff;display:grid;place-items:center}
    .stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(var(--cell)/2) calc(var(--cell)/2);opacity:.18;pointer-events:none}
    .stage-note{position:absolute;top:16px;left:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .logo-grid{position:relative;width:calc(var(--step)*7 + var(--cell));height:calc(var(--step)*2 + var(--cell));max-width:92%;transition:opacity .2s ease,transform .3s ease}
    .logo-grid.patterning{opacity:0;pointer-events:none}
    .piece{position:absolute;width:auto;height:var(--cell);display:block;transform:translate3d(calc(var(--x)*var(--step)),calc(var(--y)*var(--step)),0);transition:transform var(--motion-ms,300ms) var(--motion-ease,cubic-bezier(.2,.85,.25,1));user-select:none;will-change:transform}
    .pattern-canvas{display:none;position:absolute;inset:0;width:100%;height:100%;z-index:2;background:#080808}.pattern-canvas.active{display:block}
    .controls{border-top:1px solid var(--ink);display:flex;flex-direction:column;min-height:0}
    .controls h1{font-size:28px;line-height:1.02;margin:18px 0 8px;letter-spacing:-.05em}
    .lede{font-size:14px;line-height:1.45;margin:0 0 24px;color:rgba(35,24,21,.65)}
    .section{border-top:1px solid var(--ink);padding:16px 0}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .mode{min-height:86px;border:1px solid var(--ink);background:transparent;text-align:left;padding:8px 10px;font-size:13px;display:grid;grid-template-columns:54px 1fr;align-items:center;gap:9px}
    .mode img{width:54px;height:54px;object-fit:contain;filter:contrast(1.15)}
    .mode.active img{filter:invert(1)}
    .mode>span{font-size:13px;opacity:1;margin:0}.mode small{display:block;font-size:11px;opacity:.55;margin-top:4px;font-weight:400}
    .mode.active{background:var(--ink);color:#fff}
    .transport{display:grid;grid-template-columns:1fr;gap:8px}
    .primary,.secondary{height:44px;border:1px solid var(--ink);background:var(--ink);color:#fff}
    .secondary{background:transparent;color:var(--ink)}
    .range-row{display:grid;grid-template-columns:76px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin-top:12px}
    input[type=range]{width:100%;accent-color:var(--accent)}
    .beat-track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:14px}
    .beat{height:5px;background:rgba(35,24,21,.15)}.beat.on{background:var(--accent)}
    .pattern-panel[hidden]{display:none}.pattern-panel{border-top:1px solid var(--ink);padding:16px 0}
    .colors{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.color-control{font-size:10px;text-transform:uppercase;letter-spacing:.05em}.color-control input{width:100%;height:34px;margin-top:5px;padding:0;border:1px solid var(--ink);background:transparent}
    .exports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.exports button{height:42px;border:1px solid var(--ink);background:transparent}.exports button:first-child{background:var(--ink);color:white}
    footer{border-top:1px solid var(--ink);padding-top:14px;display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    @media(max-width:900px){.shell{padding:18px}.status{display:none}main{grid-template-columns:1fr;padding-top:18px}.stage{min-height:58vh}.controls{min-height:auto}.logo-grid{transform:scale(.88)} }
    @media(max-width:560px){:root{--cell:33px}.stage{min-height:460px}.logo-grid{transform:none}.controls h1{font-size:24px}footer{gap:20px}}
    @media(prefers-reduced-motion:reduce){.piece{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand">CRAFT LAB</div><div class="status">Motion playground</div></header>
    <main>
      <section class="stage" aria-label="로고 모션 미리보기">
        <div class="stage-note"><span id="stageMode">Basic</span> · Grid motion</div>
        <div class="logo-grid" id="logoGrid" aria-live="polite"></div>
        <canvas class="pattern-canvas" id="patternCanvas" aria-label="정지된 로고 프레임으로 만든 반복 패턴"></canvas>
      </section>
      <aside class="controls">
        <h1>Logo<br>in motion.</h1>
        <p class="lede">슬라이드의 구조를 따라 글자들이 가로·세로 격자 위에서 한 칸씩 맞물려 이동합니다.</p>
        <section class="section">
          <div class="section-title"><span>Format</span><span id="formatLabel">Basic</span></div>
          <div class="modes">
            <button class="mode active" data-mode="basic"><img src="assets/basic.svg" alt=""><span>기본형<small>All motion loop</small></span></button>
            <button class="mode" data-mode="row1"><img src="assets/row1.svg" alt=""><span>1 row<small>Horizontal</small></span></button>
            <button class="mode" data-mode="row2"><img src="assets/row2.svg" alt=""><span>2 row<small>Stacked</small></span></button>
            <button class="mode" data-mode="row3"><img src="assets/row3.svg" alt=""><span>3 row<small>Compact</small></span></button>
          </div>
        </section>
        <section class="section">
          <div class="section-title"><span>Playback</span><span id="playState">Ready</span></div>
          <div class="transport"><button class="primary" id="play">Pause loop</button></div>
          <div class="range-row"><label for="bpm">BPM</label><input id="bpm" type="range" min="80" max="180" value="130" step="1"><output id="bpmOut">130</output></div>
          <div class="range-row"><label for="tightness">Tightness</label><input id="tightness" type="range" min="0" max="100" value="72" step="1"><output id="tightnessOut">72%</output></div>
          <div class="beat-track" id="beatTrack" aria-hidden="true"></div>
        </section>
        <section class="pattern-panel" id="patternPanel" hidden>
          <div class="section-title"><span>Pattern builder</span><span>Paused frame</span></div>
          <div class="range-row"><label for="patternScale">Scale</label><input id="patternScale" type="range" min="28" max="120" value="58" step="1"><output id="patternScaleOut">58</output></div>
          <div class="range-row"><label for="patternOffset">Offset</label><input id="patternOffset" type="range" min="-4" max="4" value="1" step="1"><output id="patternOffsetOut">1칸</output></div>
          <div class="colors">
            <label class="color-control">Space 1<input id="color1" type="color" value="#62ff00"></label>
            <label class="color-control">Space 2<input id="color2" type="color" value="#ff6500"></label>
            <label class="color-control">Space 3<input id="color3" type="color" value="#6a00ff"></label>
            <label class="color-control">Ground<input id="colorBg" type="color" value="#080808"></label>
          </div>
          <div class="exports"><button id="savePng">Save PNG</button><button id="saveSvg">Save SVG</button></div>
        </section>
      </aside>
    </main>
    <footer><span>Interactive identity system</span><span>K ARTS CCID · 2026</span></footer>
  </div>
  <script>
    const elements=[
      {name:'CR',src:'assets/cr.svg',span:2},
      {name:'A',src:'assets/a.svg',span:1},
      {name:'F',src:'assets/f.svg',span:1},
      {name:'T',src:'assets/t.svg',span:1},
      {name:'LAB',src:'assets/lab.svg',span:3}
    ];
    const layouts={
      basic:[[0,0],[0,1],[1,1],[2,1],[0,2]],
      row1Spread:[[0,0],[2,1],[3,1],[4,1],[5,2]],
      row1Expand:[[0,1],[2,1],[3,1],[4,1],[5,2]],
      row1:[[0,1],[2,1],[3,1],[4,1],[5,1]],
      r1ArtsL:[[0,1],[2,0],[3,1],[4,1],[5,0]],
      r1ArtsR:[[0,0],[2,1],[3,0],[4,0],[5,1]],
      r1FabL:[[0,1],[2,1],[3,0],[4,1],[5,0]],
      r1FabR:[[0,0],[2,0],[3,1],[4,0],[5,1]],
      r1TechL:[[0,1],[2,1],[3,1],[4,0],[5,0]],
      r1TechR:[[0,0],[2,0],[3,0],[4,1],[5,1]],
      row2Drop:[[0,1],[2,1],[3,1],[4,1],[5,2]],
      row2Slide:[[0,1],[2,1],[3,1],[4,1],[2,2]],
      r2A2:[[0,1],[2,0],[3,1],[4,1],[2,2]],
      r2A1:[[0,1],[2,0],[3,1],[4,1],[1,2]],
      r2A0:[[0,1],[2,0],[3,1],[4,1],[0,2]],
      r2F0:[[0,1],[2,1],[3,0],[4,1],[0,2]],
      r2F1:[[0,1],[2,1],[3,0],[4,1],[1,2]],
      r2F2:[[0,1],[2,1],[3,0],[4,1],[2,2]],
      r2T2:[[0,1],[2,1],[3,1],[4,0],[2,2]],
      r2T1:[[0,1],[2,1],[3,1],[4,0],[1,2]],
      r2T0:[[0,1],[2,1],[3,1],[4,0],[0,2]],
      r3Prep1:[[0,0],[2,0],[3,1],[4,1],[5,2]],
      r3Prep2:[[0,0],[2,0],[3,1],[4,2],[5,2]],
      r3Prep3:[[0,0],[2,0],[3,1],[2,2],[5,2]],
      r3Prep4:[[0,0],[2,0],[2,1],[2,2],[5,2]],
      r3A2:[[0,0],[2,0],[2,1],[2,2],[3,2]],
      r3A1:[[0,0],[2,0],[2,1],[2,2],[3,1]],
      r3A0:[[0,0],[2,0],[2,1],[2,2],[3,0]],
      r3F0:[[0,1],[2,0],[2,1],[2,2],[3,0]],
      r3F1:[[0,1],[2,0],[2,1],[2,2],[3,1]],
      r3F2:[[0,1],[2,0],[2,1],[2,2],[3,2]],
      r3T2:[[0,2],[2,0],[2,1],[2,2],[3,2]],
      r3T1:[[0,2],[2,0],[2,1],[2,2],[3,1]],
      r3T0:[[0,2],[2,0],[2,1],[2,2],[3,0]]
    };
    const labels={basic:'Basic',row1:'1 row',row2:'2 row',row3:'3 row'};
    const grid=document.querySelector('#logoGrid');
    let mode='basic',poseName='basic',runId=0,beatIndex=0,isLooping=true;
    const pieces=elements.map((element)=>{const image=document.createElement('img');image.className='piece';image.src=element.src;image.alt='';image.style.setProperty('--span',element.span);image.setAttribute('aria-hidden','true');grid.appendChild(image);return image});
    const beats=Array.from({length:8},()=>{const b=document.createElement('i');b.className='beat';document.querySelector('#beatTrack').appendChild(b);return b});
    const row1Sequence=['basic','basic','basic','row1Spread','row1Expand','row1','r1ArtsL','r1ArtsR','r1FabL','r1FabR','r1TechL','r1TechR','row1','row1Expand','row1Spread','basic','basic'];
    const row2Sequence=['basic','basic','basic','row1Spread','row1Expand','row1','row2Drop','row2Slide','r2A2','r2A1','r2A0','r2F0','r2F1','r2F2','r2T2','r2T1','r2T0','row2Slide','row2Drop','row1','row1Expand','row1Spread','basic','basic'];
    const row3Sequence=['basic','basic','basic','row1Spread','row1Expand','row1','row2Drop','row2Slide','r2A2','r3Prep1','r3Prep2','r3Prep3','r3Prep4','r3A2','r3A1','r3A0','r3F0','r3F1','r3F2','r3T2','r3T1','r3T0','r3T1','r3T2','r3F2','r3A2','r3Prep4','r3Prep3','r3Prep2','r3Prep1','r2A2','row2Slide','row2Drop','row1','row1Expand','row1Spread','basic','basic'];
    const sequences={row1:row1Sequence,row2:row2Sequence,row3:row3Sequence};
    sequences.basic=[...row1Sequence,...row2Sequence,...row3Sequence];
    const patternCanvas=document.querySelector('#patternCanvas');
    const patternPanel=document.querySelector('#patternPanel');
    let patternMode=false;
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    function timing(){const beat=60000/+document.querySelector('#bpm').value;const tight=+document.querySelector('#tightness').value/100;return {beat,motion:beat*(.92-tight*.58)}}
    function setPose(name){poseName=name;const pose=layouts[name];pieces.forEach((piece,i)=>{piece.style.setProperty('--x',pose[i][0]);piece.style.setProperty('--y',pose[i][1])})}
    function setBeat(i){beatIndex=i;beats.forEach((b,n)=>b.classList.toggle('on',n===i%beats.length))}
    function syncControls(){const {motion}=timing();const tight=+document.querySelector('#tightness').value;document.documentElement.style.setProperty('--motion-ms',motion+'ms');document.documentElement.style.setProperty('--motion-ease',tight>70?'cubic-bezier(.18,.92,.22,1)':'cubic-bezier(.45,0,.25,1)');document.querySelector('#bpmOut').textContent=document.querySelector('#bpm').value;document.querySelector('#tightnessOut').textContent=tight+'%'}
    function patternSettings(multiplier=1){return {cell:Math.round(+document.querySelector('#patternScale').value*multiplier),offset:+document.querySelector('#patternOffset').value,colors:[document.querySelector('#color1').value,document.querySelector('#color2').value,document.querySelector('#color3').value],background:document.querySelector('#colorBg').value}}
    function patternGeometry(multiplier=1){const settings=patternSettings(multiplier),pose=layouts[poseName],step=settings.cell;let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;pose.forEach(([x,y],i)=>{minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x+elements[i].span-1);maxY=Math.max(maxY,y)});const gridMinX=minX,gridMinY=minY,gridMaxX=maxX,gridMaxY=maxY;const cols=gridMaxX-gridMinX+1,rows=gridMaxY-gridMinY+1;return {settings,pose,step,minX,minY,maxX,maxY,gridMinX,gridMinY,gridMaxX,gridMaxY,tileW:cols*step,tileH:rows*step}}
    function occupiedCells(pose){const occupied=new Set();pose.forEach(([x,y],i)=>{for(let n=0;n<elements[i].span;n++)occupied.add(`${x+n},${y}`)});return occupied}
    async function drawPattern(canvas,width,height,multiplier=1){canvas.width=Math.round(width);canvas.height=Math.round(height);const ctx=canvas.getContext('2d');const g=patternGeometry(multiplier),occupied=occupiedCells(g.pose);ctx.fillStyle=g.settings.background;ctx.fillRect(0,0,width,height);let row=0;for(let tileY=-g.tileH;tileY<height+g.tileH;tileY+=g.tileH){const stagger=(row%2)*g.step*g.settings.offset;for(let tileX=-g.tileW*2+stagger;tileX<width+g.tileW;tileX+=g.tileW){const originX=Math.round(tileX-g.gridMinX*g.step),originY=Math.round(tileY-g.gridMinY*g.step);for(let y=g.gridMinY;y<=g.gridMaxY;y++){for(let x=g.gridMinX;x<=g.gridMaxX;x++){if(occupied.has(`${x},${y}`))continue;ctx.fillStyle=g.settings.colors[Math.abs(x*2+y)%g.settings.colors.length];ctx.fillRect(originX+x*g.step,originY+y*g.step,g.step+1,g.step+1)}}}row++}}
    function buildPatternSvg(width=2400,height=1600,multiplier=2.5){const g=patternGeometry(multiplier),occupied=occupiedCells(g.pose),parts=[`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="${g.settings.background}"/>`];let row=0;for(let tileY=-g.tileH;tileY<height+g.tileH;tileY+=g.tileH){const stagger=(row%2)*g.step*g.settings.offset;for(let tileX=-g.tileW*2+stagger;tileX<width+g.tileW;tileX+=g.tileW){const originX=Math.round(tileX-g.gridMinX*g.step),originY=Math.round(tileY-g.gridMinY*g.step);for(let y=g.gridMinY;y<=g.gridMaxY;y++){for(let x=g.gridMinX;x<=g.gridMaxX;x++){if(occupied.has(`${x},${y}`))continue;const color=g.settings.colors[Math.abs(x*2+y)%g.settings.colors.length];parts.push(`<rect x="${originX+x*g.step}" y="${originY+y*g.step}" width="${g.step+1}" height="${g.step+1}" fill="${color}"/>`)}}}row++}parts.push('</svg>');return parts.join('')}
    function refreshPattern(){if(!patternMode)return;const rect=document.querySelector('.stage').getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);drawPattern(patternCanvas,rect.width*dpr,rect.height*dpr,dpr)}
    function enterPattern(){patternMode=true;patternPanel.hidden=false;patternCanvas.classList.add('active');grid.classList.add('patterning');document.querySelector('#stageMode').textContent='Pattern';refreshPattern()}
    function exitPattern(){patternMode=false;patternPanel.hidden=true;patternCanvas.classList.remove('active');grid.classList.remove('patterning');document.querySelector('#stageMode').textContent=labels[mode]}
    function downloadBlob(blob,name){const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    async function playLoop(target){exitPattern();const id=++runId;mode=target;isLooping=true;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelector('#formatLabel').textContent=labels[mode];document.querySelector('#stageMode').textContent=labels[mode];document.querySelector('#playState').textContent='Looping';document.querySelector('#play').textContent='Pause loop';const steps=sequences[target];let cycle=0;while(id===runId&&isLooping){for(let i=0;i<steps.length;i++){if(id!==runId||!isLooping)return;syncControls();setPose(steps[i]);setBeat(cycle+i);await sleep(timing().beat)}cycle+=steps.length}}
    document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>playLoop(b.dataset.mode));
    function togglePlayback(){if(isLooping){isLooping=false;++runId;document.querySelector('#playState').textContent='Pattern';document.querySelector('#play').textContent='Resume loop';enterPattern()}else{playLoop(mode)}}
    document.querySelector('#play').onclick=togglePlayback;
    document.querySelector('#bpm').oninput=syncControls;
    document.querySelector('#tightness').oninput=syncControls;
    ['patternScale','patternOffset','color1','color2','color3','colorBg'].forEach(id=>document.querySelector('#'+id).oninput=()=>{document.querySelector('#patternScaleOut').textContent=document.querySelector('#patternScale').value;document.querySelector('#patternOffsetOut').textContent=document.querySelector('#patternOffset').value+'칸';refreshPattern()});
    document.querySelector('#savePng').onclick=async()=>{const canvas=document.createElement('canvas');await drawPattern(canvas,2400,1600,2.5);canvas.toBlob(blob=>downloadBlob(blob,'craft-lab-pattern.png'),'image/png')};
    document.querySelector('#saveSvg').onclick=()=>downloadBlob(new Blob([buildPatternSvg()],{type:'image/svg+xml'}),'craft-lab-pattern.svg');
    window.addEventListener('resize',refreshPattern);
    window.addEventListener('keydown',event=>{if(event.code==='Space'&&!event.target.matches('input,button')){event.preventDefault();togglePlayback()}});
    syncControls();setPose('basic');setBeat(0);setTimeout(()=>playLoop('basic'),timing().beat);
  </script>
</body>
</html>
