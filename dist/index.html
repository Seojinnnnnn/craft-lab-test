<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CRAFT LAB 로고의 행 구성과 개별 글자 움직임을 실험하는 모션 플레이그라운드">
  <title>CRAFT LAB · Motion Playground</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23231815'/%3E%3Cpath d='M7 7h18v18H7z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 11h8v10h-8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root { --ink:#231815; --paper:#f7f7f4; --line:rgba(35,24,21,.25); --accent:#ff5c35; --cell:clamp(52px,7vw,86px); }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:24px 28px 20px}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:15px}
    .brand{font-size:14px;font-weight:700;letter-spacing:-.02em}
    .status{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(255,92,53,.12)}
    main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:28px 0 18px;min-height:0}
    .stage{position:relative;overflow:hidden;min-height:620px;border:1px solid var(--ink);background:#fff;display:grid;place-items:center}
    .stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(var(--cell)/2) calc(var(--cell)/2);opacity:.18;pointer-events:none}
    .stage-note{position:absolute;top:16px;left:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .logo-grid{position:relative;width:calc(var(--cell)*8);height:calc(var(--cell)*3);max-width:92%;transition:transform .3s ease}
    .tile{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;border:2px solid var(--ink);font-size:calc(var(--cell)*.54);font-weight:400;line-height:1;background:#fff;transform:translate3d(calc(var(--x)*var(--cell)),calc(var(--y)*var(--cell)),0);transition:transform var(--motion-ms,300ms) var(--motion-ease,cubic-bezier(.2,.85,.25,1)),background .14s,color .14s;user-select:none;will-change:transform}
    .tile.moving{z-index:2}
    .controls{border-top:1px solid var(--ink);display:flex;flex-direction:column;min-height:0}
    .controls h1{font-size:28px;line-height:1.02;margin:18px 0 8px;letter-spacing:-.05em}
    .lede{font-size:14px;line-height:1.45;margin:0 0 24px;color:rgba(35,24,21,.65)}
    .section{border-top:1px solid var(--ink);padding:16px 0}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .mode{min-height:86px;border:1px solid var(--ink);background:transparent;text-align:left;padding:8px 10px;font-size:13px;display:grid;grid-template-columns:54px 1fr;align-items:center;gap:9px}
    .mode img{width:54px;height:54px;object-fit:contain;filter:contrast(1.15)}
    .mode.active img{filter:invert(1)}
    .mode>span{font-size:13px;opacity:1;margin:0}.mode small{display:block;font-size:11px;opacity:.55;margin-top:4px;font-weight:400}
    .mode.active{background:var(--ink);color:#fff}
    .transport{display:grid;grid-template-columns:1fr;gap:8px}
    .primary,.secondary{height:44px;border:1px solid var(--ink);background:var(--ink);color:#fff}
    .secondary{background:transparent;color:var(--ink)}
    .range-row{display:grid;grid-template-columns:76px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin-top:12px}
    input[type=range]{width:100%;accent-color:var(--accent)}
    .beat-track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:14px}
    .beat{height:5px;background:rgba(35,24,21,.15)}.beat.on{background:var(--accent)}
    footer{border-top:1px solid var(--ink);padding-top:14px;display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    @media(max-width:900px){.shell{padding:18px}.status{display:none}main{grid-template-columns:1fr;padding-top:18px}.stage{min-height:58vh}.controls{min-height:auto}.logo-grid{transform:scale(.88)} }
    @media(max-width:560px){:root{--cell:33px}.stage{min-height:460px}.logo-grid{transform:none}.controls h1{font-size:24px}footer{gap:20px}}
    @media(prefers-reduced-motion:reduce){.tile{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand">CRAFT LAB</div><div class="status">Motion playground</div></header>
    <main>
      <section class="stage" aria-label="로고 모션 미리보기">
        <div class="stage-note"><span id="stageMode">Basic</span> · Grid motion</div>
        <div class="logo-grid" id="logoGrid" aria-live="polite"></div>
      </section>
      <aside class="controls">
        <h1>Logo<br>in motion.</h1>
        <p class="lede">슬라이드의 구조를 따라 글자들이 가로·세로 격자 위에서 한 칸씩 맞물려 이동합니다.</p>
        <section class="section">
          <div class="section-title"><span>Format</span><span id="formatLabel">Basic</span></div>
          <div class="modes">
            <button class="mode active" data-mode="basic"><img src="assets/basic.svg" alt=""><span>기본형<small>Dynamic block</small></span></button>
            <button class="mode" data-mode="row1"><img src="assets/row1.svg" alt=""><span>1 row<small>Horizontal</small></span></button>
            <button class="mode" data-mode="row2"><img src="assets/row2.svg" alt=""><span>2 row<small>Stacked</small></span></button>
            <button class="mode" data-mode="row3"><img src="assets/row3.svg" alt=""><span>3 row<small>Compact</small></span></button>
          </div>
        </section>
        <section class="section">
          <div class="section-title"><span>Playback</span><span id="playState">Ready</span></div>
          <div class="transport"><button class="primary" id="play">Replay selected motion</button></div>
          <div class="range-row"><label for="bpm">BPM</label><input id="bpm" type="range" min="80" max="180" value="130" step="1"><output id="bpmOut">130</output></div>
          <div class="range-row"><label for="tightness">Tightness</label><input id="tightness" type="range" min="0" max="100" value="72" step="1"><output id="tightnessOut">72%</output></div>
          <div class="beat-track" id="beatTrack" aria-hidden="true"></div>
        </section>
      </aside>
    </main>
    <footer><span>Interactive identity system</span><span>K ARTS CCID · 2026</span></footer>
  </div>
  <script>
    const letters=[...'CRAFTLAB'];
    const layouts={
      basic:[[0,1],[1,1],[2,0],[3,2],[4,0],[5,1],[6,1],[7,1]],
      row1:[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],
      row1A:[[0,1],[1,1],[2,0],[3,1],[4,1],[5,1],[6,1],[7,1]],
      row1F:[[0,1],[1,1],[2,1],[3,2],[4,1],[5,1],[6,1],[7,1]],
      row1T:[[0,1],[1,1],[2,1],[3,1],[4,0],[5,1],[6,1],[7,1]],
      row2:[[0,0],[1,0],[2,0],[3,0],[4,0],[2,1],[3,1],[4,1]],
      row2A:[[0,0],[1,0],[2,-1],[3,0],[4,0],[2,1],[3,1],[4,1]],
      row2F:[[0,0],[1,0],[2,0],[3,1],[4,0],[2,1],[3,2],[4,1]],
      row2T:[[0,0],[1,0],[2,0],[3,0],[5,0],[2,1],[3,1],[4,1]],
      row2Down:[[0,0],[1,0],[2,0],[3,0],[4,0],[2,2],[3,2],[4,2]],
      row3Wide:[[0,0],[1,0],[2,1],[3,1],[4,1],[2,2],[3,2],[4,2]],
      row3:[[0,0],[1,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]],
      row3T:[[0,0],[1,0],[0,1],[1,1],[2,0],[0,2],[1,2],[2,2]],
      row3B:[[0,0],[1,0],[0,1],[1,1],[2,1],[0,2],[1,2],[3,2]],
      row3C:[[-1,0],[1,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]]
    };
    const labels={basic:'Basic',row1:'1 row',row2:'2 row',row3:'3 row'};
    const grid=document.querySelector('#logoGrid');
    let mode='basic',poseName='basic',runId=0,beatIndex=0;
    const tiles=letters.map((letter)=>{const b=document.createElement('div');b.className='tile';b.textContent=letter;b.setAttribute('aria-hidden','true');grid.appendChild(b);return b});
    const beats=Array.from({length:8},()=>{const b=document.createElement('i');b.className='beat';document.querySelector('#beatTrack').appendChild(b);return b});
    const sequences={
      basic:['basic'],
      row1:['basic','row1','row1A','row1','row1F','row1','row1T','row1'],
      row2:['basic','row1','row2','row2A','row2','row2F','row2','row2T','row2'],
      row3:['basic','row1','row2','row2Down','row3Wide','row3','row3T','row3','row3B','row3','row3C','row3']
    };
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    function timing(){const beat=60000/+document.querySelector('#bpm').value;const tight=+document.querySelector('#tightness').value/100;return {beat,motion:beat*(.92-tight*.58)}}
    function setPose(name){poseName=name;const pose=layouts[name];tiles.forEach((t,i)=>{t.style.setProperty('--x',pose[i][0]);t.style.setProperty('--y',pose[i][1])})}
    function setBeat(i){beatIndex=i;beats.forEach((b,n)=>b.classList.toggle('on',n===i%beats.length))}
    function syncControls(){const {motion}=timing();const tight=+document.querySelector('#tightness').value;document.documentElement.style.setProperty('--motion-ms',motion+'ms');document.documentElement.style.setProperty('--motion-ease',tight>70?'cubic-bezier(.18,.92,.22,1)':'cubic-bezier(.45,0,.25,1)');document.querySelector('#bpmOut').textContent=document.querySelector('#bpm').value;document.querySelector('#tightnessOut').textContent=tight+'%'}
    async function playSequence(target){const id=++runId;mode=target;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelector('#formatLabel').textContent=labels[mode];document.querySelector('#stageMode').textContent=labels[mode];document.querySelector('#playState').textContent='Playing';const steps=sequences[target];for(let i=0;i<steps.length;i++){if(id!==runId)return;syncControls();setPose(steps[i]);setBeat(i);await sleep(timing().beat)}if(id===runId)document.querySelector('#playState').textContent='Complete'}
    document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>playSequence(b.dataset.mode));
    document.querySelector('#play').onclick=()=>playSequence(mode);
    document.querySelector('#bpm').oninput=syncControls;
    document.querySelector('#tightness').oninput=syncControls;
    syncControls();setPose('basic');setBeat(0);
  </script>
</body>
</html>
